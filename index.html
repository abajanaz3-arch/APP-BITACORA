<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bitácora de Movilización</title>

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1877f2" />
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1048/1048953.png" sizes="512x512" />

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="container">
    <h1>Bitácora de Movilización</h1>

    <form id="bitacoraForm">
      <label for="fecha">Fecha</label>
      <input id="fecha" type="date" required />

      <div class="horas">
        <div>
          <label for="horaEntrada">Hora entrada</label>
          <input id="horaEntrada" type="time" />
        </div>
        <div>
          <label for="horaSalida">Hora salida</label>
          <input id="horaSalida" type="time" />
        </div>
      </div>

      <label for="motivo">Motivo</label>
      <textarea id="motivo" rows="2"></textarea>

      <label for="supervisor">Supervisor</label>
      <input id="supervisor" type="text" />

      <label for="Desde">Desde</label>
      <input id="Desde" type="text" />

      <label for="Hasta">Hasta</label>
      <input id="Hasta" type="text" />

      <button type="submit">Guardar Registro</button>
    </form>

    <div class="table-container" aria-live="polite">
      <table id="tablaRegistros" role="table">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Entrada</th>
            <th>Salida</th>
            <th>Motivo</th>
            <th>Supervisor</th>
            <th>Desde</th>
            <th>Hasta</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="./script.js" defer></script>
</body>
</html>
