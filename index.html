<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Bitácora de Movilización</title>

  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1877f2" />
  
  <link rel="stylesheet" href="./style.css" />

<button id="themeToggle" class="btn-tema" type="button">Cambiar Tema</button>

  <style>

    .select-lugar {
      background-color: #ff0000;
      color: #151515;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ff0000;
      width: 100%;
      box-sizing: border-box;
      -webkit-appearance: none;
      appearance: none;
    }
    select.select-lugar option {
      background-color: #ff0000bb;
      color: #000000;
    }
    .select-wrapper {
      position: relative;
    }
    .select-wrapper::after {
      content: "▾";
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #197e74;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Bitácora de Movilización</h1>

    <form id="bitacoraForm">
      <label for="fecha">Fecha</label>
      <input id="fecha" type="date" required />

      <div class="horas">
        <div>
          <label for="horaEntrada">Hora entrada</label>
          <input id="horaEntrada" type="time" />
        </div>
        <div>
          <label for="horaSalida">Hora salida</label>
          <input id="horaSalida" type="time" />
        </div>
      </div>

      <label for="motivo">Motivo</label>
      <textarea id="motivo" rows="2"></textarea>
      

      <label for="supervisor">Supervisor</label>
      <input id="supervisor" type="text" />

      <label for="Desde">Desde</label>
      <div class="select-wrapper">
        <select id="Desde" class="select-lugar">
          <option value=""></option>
          <option>Acruxza</option>
          <option>The Best</option>
          <option>Bodegas Carlota</option>
          <option>Bodegas Alejandra</option>
          <option>Bodegas Julian</option>
          <option>Bodegas Mayte</option>
          <option>Bodegas Papo</option>
          <option>Buho 1</option>
          <option>Buho 2</option>
          <option>Casa</option>
          <option>Casa NPG</option>
          <option>Charlotte</option>
          <option>Hotel De la E</option>
          <option>Hotel Del Parque</option>
          <option>Hotel Del Sur</option>
          <option>Extancia</option>
          <option>Extasis Duran</option>
          <option>Extasis Norte</option>
          <option>Green House</option>
          <option>Orlando</option>
          <option>Extasis Norte</option>
          <option>Extasis Sur</option>
          <option>Extasis Duran</option>
          <option>Best</option>
          <option>De la E</option>
          <option>Del Sur</option>
          <option>HDC</option>
          <option>West</option>
          <option>Lilax</option>
          <option>Fortich/Buho1</option>
          <option>Roxy</option>
          <option>Queen</option>
          <option>Del Parque</option>
          <option>Lavanderia</option>
        </select>
      </div>

      <label for="Hasta">Hasta</label>
      <div class="select-wrapper">
        <select id="Hasta" class="select-lugar">
          <option value=""></option>
          <option>Acruxza</option>
          <option>The Best</option>
          <option>Bodegas Carlota</option>
          <option>Bodegas Alejandra</option>
          <option>Bodegas Julian</option>
          <option>Bodegas Mayte</option>
          <option>Bodegas Papo</option>
          <option>Buho 1</option>
          <option>Buho 2</option>
          <option>Casa</option>
          <option>Casa NPG</option>
          <option>Charlotte</option>
          <option>Hotel De la E</option>
          <option>Hotel Del Parque</option>
          <option>Hotel Del Sur</option>
          <option>Extancia</option>
          <option>Extasis Duran</option>
          <option>Extasis Norte</option>
          <option>Green House</option>
          <option>Orlando</option>
          <option>Extasis Norte</option>
          <option>Extasis Sur</option>
          <option>Extasis Duran</option>
          <option>The Best</option>
          <option>De la E</option>
          <option>Del Sur</option>
          <option>HDC</option>
          <option>West</option>
          <option>Lilax</option>
          <option>Fortich/Buho1</option>
          <option>Roxy</option>
          <option>Queen</option>
          <option>Del Parque</option>
          <option>Lavanderia</option>
        </select>
      </div>
      
      

      <button type="submit">Guardar Registro</button>
    </form>

    <div class="table-container" aria-live="polite">
      <table id="tablaRegistros" role="table">
        <thead>
          <tr>
            <th>Fecha</th>
            <th>Entrada</th>
            <th>Salida</th>
            <th>Motivo</th>
            <th>Supervisor</th>
            <th>Desde</th>
            <th>Hasta</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script src="./script.js" defer></script>
</body>
</html>
